<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1c1f" />
    <title>Notes</title>
    <script>
      /* The stylesheet describes dark exactly once, under [data-theme="dark"],
         and React writes that attribute on mount. Without this line the first
         painted frame would be light on a dark desk. The member's own saved
         choice arrives with the workspace and supersedes this guess. */
      document.documentElement.dataset.theme =
        window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
